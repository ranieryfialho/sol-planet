# Usa o Postgres que já roda na VPS (rede externa PG_NETWORK) e o WAHA que já existe lá:
# aponte WAHA_URL e WAHA_API_KEY no .env (cada conta cria a própria sessão `solar-<login>-<id>`).
# Crie antes o banco `solar`. O serviço `waha` abaixo só sobe com `--profile waha`
# (para quem não tem um WAHA).
services:
  web:
    build: { context: ., target: web }
    container_name: solar-web
    restart: unless-stopped
    # login do dashboard = conta Solplanet de cada usuário (cadastrada no 1º login)
    env_file: .env
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    networks: [default, pg]

  worker:
    build: { context: ., target: worker }
    container_name: solar-worker
    restart: unless-stopped
    env_file: .env
    networks: [default, pg]

  waha:
    profiles: ["waha"]
    image: devlikeapro/waha:gows-2026.10.1
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      # volta a conectar as sessões depois de reiniciar o contêiner
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha_sessions:/app/.sessions
    # só localhost: o pareamento (QR code) é feito pela tela Ajustes do dashboard
    ports:
      - "127.0.0.1:3015:3000"
    networks: [default, pg]

volumes:
  waha_sessions:

networks:
  pg:
    external: true
    name: ${PG_NETWORK}
