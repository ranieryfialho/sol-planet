name: Deploy Solar

# Dois ambientes, em sequência: staging (dados simulados) → produção (exige aprovação no GitHub Environment).
# Dispara a cada push na main (e só aí, por causa da proteção da branch) ou à mão, informando um commit
# anterior em `ref`: é assim que se faz o rollback. A estratégia completa está em docs/deploy.md.
on:
  push:
    branches: [main]
    # só documentação não precisa reconstruir e reiniciar os containers
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag ou branch a implantar (vazio = o selecionado em 'Use workflow from'). Para rollback, informe um commit anterior."
        required: false
        default: ""

concurrency:
  group: deploy-solar
  cancel-in-progress: false

jobs:
  staging:
    uses: ./.github/workflows/_deploy-ambiente.yml
    secrets: inherit
    with:
      ambiente: staging
      pasta: solar-staging
      projeto: solar-staging
      compose: docker-compose.staging.yml
      porta_padrao: "3011"
      ref: ${{ inputs.ref }}

  producao:
    needs: staging
    uses: ./.github/workflows/_deploy-ambiente.yml
    secrets: inherit
    with:
      ambiente: production
      pasta: solar
      projeto: solar
      compose: docker-compose.yml
      porta_padrao: "3000"
      ref: ${{ inputs.ref }}
