name: Deploy Solar

# Dois ambientes. O staging (dados simulados) é implantado a cada push na main. A produção só sobe por
# acionamento manual ("Run workflow"): o clique é a aprovação e o mesmo botão faz o rollback, informando em
# `ref` um commit anterior. A estratégia completa está em docs/deploy.md.
on:
  push:
    branches: [main]
    # só documentação não precisa reconstruir e reiniciar os containers
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Onde implantar"
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: "Commit, tag ou branch a implantar (vazio = o selecionado em 'Use workflow from'). Para rollback, informe um commit anterior."
        required: false
        default: ""

concurrency:
  group: deploy-solar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    # push na main, ou acionamento manual escolhendo staging (aceita qualquer branch, para testar antes do merge)
    if: github.event_name == 'push' || inputs.ambiente == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Checkout (a ação de deploy vem daqui; o ref pedido é tratado dentro dela)
        uses: actions/checkout@v4
      - name: Deploy no staging
        uses: ./.github/actions/deploy-vps
        with:
          ambiente: staging
          pasta: solar-staging
          projeto: solar-staging
          compose: docker-compose.staging.yml
          porta_padrao: "3011"
          ref: ${{ inputs.ref }}
          host: ${{ secrets.VPS_HOST }}
          porta_ssh: ${{ secrets.VPS_PORT }}
          usuario: ${{ secrets.VPS_USER }}
          chave: ${{ secrets.VPS_SSH_KEY }}

  producao:
    # só manual e só a partir da main: uma branch sem revisão nunca chega à produção
    # (o `ref` livre existe para o rollback para um commit antigo da main)
    if: github.event_name == 'workflow_dispatch' && inputs.ambiente == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout (a ação de deploy vem daqui; o ref pedido é tratado dentro dela)
        uses: actions/checkout@v4
      - name: Deploy na produção
        uses: ./.github/actions/deploy-vps
        with:
          ambiente: production
          pasta: solar
          projeto: solar
          compose: docker-compose.yml
          porta_padrao: "3000"
          ref: ${{ inputs.ref }}
          host: ${{ secrets.VPS_HOST }}
          porta_ssh: ${{ secrets.VPS_PORT }}
          usuario: ${{ secrets.VPS_USER }}
          chave: ${{ secrets.VPS_SSH_KEY }}
