name: Deploy Solar

# Dois ambientes. O staging (dados simulados) é implantado a cada push na main. A produção só sobe por
# acionamento manual ("Run workflow"): o clique é a aprovação e o mesmo botão faz o rollback, informando em
# `ref` um commit anterior. A estratégia completa está em docs/deploy.md.
on:
  push:
    branches: [main]
    # só documentação não precisa reconstruir e reiniciar os containers
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Onde implantar"
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: "Commit, tag ou branch a implantar (vazio = o selecionado em 'Use workflow from'). Para rollback, informe um commit anterior."
        required: false
        default: ""

concurrency:
  group: deploy-solar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    # push na main, ou acionamento manual escolhendo staging (aceita qualquer branch, para testar antes do merge)
    if: github.event_name == 'push' || inputs.ambiente == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Checkout (a ação de deploy vem daqui; o ref pedido é tratado dentro dela)
        uses: actions/checkout@v4
      - name: Deploy no staging
        uses: ./.github/actions/deploy-vps
        with:
          ambiente: staging
          pasta: solar-staging
          projeto: solar-staging
          compose: docker-compose.staging.yml
          porta_padrao: "3011"
          ref: ${{ inputs.ref }}
          auth_secret: ${{ secrets.STAGING_AUTH_SECRET }}
          host: ${{ secrets.VPS_HOST }}
          porta_ssh: ${{ secrets.VPS_PORT }}
          usuario: ${{ secrets.VPS_USER }}
          chave: ${{ secrets.VPS_SSH_KEY }}

  # Logo depois do deploy, confere a API na URL pública do staging (scripts/smoke-api.mjs, sem gravar dados) e mede o
  # SLO (p95 < 300 ms) com o k6. Não bloqueia nada: a produção é manual. O job só sinaliza (vermelho) se algo falhar.
  desempenho:
    name: verificação do staging (API e k6)
    needs: staging
    if: needs.staging.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      URL_STAGING: https://staging-solar.rafiweb.com.br
      AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Sem o secret STAGING_AUTH_SECRET, o k6 não tem como assinar a sessão
        if: env.AUTH_SECRET == ''
        run: |
          echo "::warning::Secret STAGING_AUTH_SECRET não definido no Environment staging: o teste de desempenho foi pulado."

      - name: Verificação da API (contrato e Swagger, sem gravar dados)
        if: env.AUTH_SECRET != ''
        shell: bash
        env:
          BASE_URL: ${{ env.URL_STAGING }}
          CHECK_DOCS: "1"
        run: node scripts/smoke-api.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test k6 (p95 pela rede)
        # roda mesmo se a verificação da API falhou, para uma rodada mostrar as duas coisas
        if: always() && env.AUTH_SECRET != ''
        run: |
          mkdir -p k6-out && chmod 777 k6-out
          set +e
          docker run --rm -v "$PWD:/work" -e BASE_URL="$URL_STAGING" -e AUTH_SECRET \
            grafana/k6:1.3.0 run --summary-export=/work/k6-out/resumo.json /work/k6/smoke.js
          codigo=$?
          set -e
          node -e '
            const m = require("./k6-out/resumo.json").metrics;
            const d = m["http_req_duration{endpoint:resumo}"], c = m.checks;
            const f = (n) => n.toFixed(1) + " ms";
            console.log(`## k6 no staging (${process.env.URL_STAGING})\n`);
            console.log("| Métrica | Valor |\n|---|---|");
            console.log(`| p95 | **${f(d["p(95)"])}** (SLO: < 300 ms) |`);
            console.log(`| mediana | ${f(d.med)} |`);
            console.log(`| p99 | ${f(d["p(99)"])} |`);
            console.log(`| máximo | ${f(d.max)} |`);
            console.log(`| checks | ${(c.passes / (c.passes + c.fails) * 100).toFixed(1)}% |`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"
          exit $codigo

  producao:
    # só manual e só a partir da main: uma branch sem revisão nunca chega à produção
    # (o `ref` livre existe para o rollback para um commit antigo da main)
    if: github.event_name == 'workflow_dispatch' && inputs.ambiente == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout (a ação de deploy vem daqui; o ref pedido é tratado dentro dela)
        uses: actions/checkout@v4
      - name: Deploy na produção
        uses: ./.github/actions/deploy-vps
        with:
          ambiente: production
          pasta: solar
          projeto: solar
          compose: docker-compose.yml
          porta_padrao: "3000"
          ref: ${{ inputs.ref }}
          host: ${{ secrets.VPS_HOST }}
          porta_ssh: ${{ secrets.VPS_PORT }}
          usuario: ${{ secrets.VPS_USER }}
          chave: ${{ secrets.VPS_SSH_KEY }}
