name: CI

# Roda em todo push e pull request. O deploy (deploy.yml) é separado e só dispara na main.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: install, lint, typecheck, OpenAPI e testes
    runs-on: ubuntu-latest
    services:
      # banco só dos testes de integração (nome *_test: o teste apaga os dados)
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: solar
          POSTGRES_PASSWORD: solar
          POSTGRES_DB: solar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U solar -d solar_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://solar:solar@localhost:5432/solar_test
      TZ: America/Sao_Paulo
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint do contrato OpenAPI (Spectral)
        run: pnpm lint:openapi

      - name: Testes (unitários + integração) com cobertura mínima
        run: pnpm test:coverage

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t=require("./coverage/coverage-summary.json").total;console.log("| Métrica | % |\n|---|---|");for(const k of ["lines","statements","functions","branches"])console.log(`| ${k} | ${t[k].pct} |`)' >> "$GITHUB_STEP_SUMMARY"
          fi

  segredos:
    name: varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: segredo apagado depois continua no git
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner -v
