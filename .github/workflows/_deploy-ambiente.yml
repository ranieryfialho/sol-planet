name: Deploy de um ambiente (reutilizável)

# Chamado por deploy.yml, uma vez para staging e outra para produção. O job usa um GitHub Environment,
# então segredos e regras de aprovação são do ambiente (os segredos do repositório servem de padrão).
on:
  workflow_call:
    inputs:
      ambiente: { type: string, required: true } # staging | production (nome do GitHub Environment)
      pasta: { type: string, required: true } # pasta na VPS, ex.: solar-staging
      projeto: { type: string, required: true } # nome do projeto do docker compose
      compose: { type: string, required: true } # arquivo compose usado
      porta_padrao: { type: string, required: true } # usada só se o .env não definir WEB_PORT
      ref: { type: string, required: false, default: "" } # commit/branch/tag; vazio = o que disparou

jobs:
  deploy:
    name: deploy ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}
    steps:
      - name: 1. Puxando o código no GitHub
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: 2. Preparando a pasta na VPS (preserva o .env)
        uses: appleboy/ssh-action@master
        env:
          PASTA: ${{ inputs.pasta }}
          AMBIENTE: ${{ inputs.ambiente }}
          PORTA: ${{ inputs.porta_padrao }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PASTA,AMBIENTE,PORTA
          script: |
            set -e
            mkdir -p ~/$PASTA
            if [ ! -f ~/$PASTA/.env ]; then
              if [ "$AMBIENTE" = "staging" ]; then
                # staging é descartável e só tem dados simulados: cria o .env sozinho na primeira vez
                printf 'AUTH_SECRET=%s\nWEB_PORT=%s\nFEATURE_MCP=true\n' "$(openssl rand -hex 32)" "$PORTA" > ~/$PASTA/.env
              else
                echo "ERRO: ~/$PASTA/.env não existe na VPS. Crie-o a partir do .env.example antes do primeiro deploy."
                exit 1
              fi
            fi
            # apaga tudo menos o .env (e a senha de apoio do Postgres, se existir)
            find ~/$PASTA -mindepth 1 -maxdepth 1 ! -name .env ! -name .solar_pg_pw -exec rm -rf {} +

      - name: 3. Enviando os arquivos para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "~/${{ inputs.pasta }}"

      - name: 4. Construindo, ligando e conferindo a saúde
        uses: appleboy/ssh-action@master
        env:
          PASTA: ${{ inputs.pasta }}
          PROJETO: ${{ inputs.projeto }}
          COMPOSE: ${{ inputs.compose }}
          PORTA: ${{ inputs.porta_padrao }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PASTA,PROJETO,COMPOSE,PORTA
          script: |
            set -e
            cd ~/$PASTA
            docker compose -p $PROJETO -f $COMPOSE up -d --build
            docker image prune -f
            docker compose -p $PROJETO -f $COMPOSE ps
            # o deploy só vale se o /api/health responder (o job falha e o ambiente fica sinalizado)
            P=$(grep -E '^WEB_PORT=' .env | tail -1 | cut -d= -f2)
            P=${P:-$PORTA}
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$P/api/health"; then echo; echo "saudável após $((i*4))s"; exit 0; fi
              sleep 4
            done
            echo "ERRO: /api/health não respondeu em 120s"
            docker compose -p $PROJETO -f $COMPOSE logs --tail=60
            exit 1
