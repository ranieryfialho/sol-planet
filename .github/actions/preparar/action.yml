name: Preparar ambiente
description: Instala pnpm e Node (com cache) e as dependências do monorepo. Rodar depois do checkout.
inputs:
  node-version:
    description: Versão do Node
    required: false
    default: "24"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4 # a versão do pnpm vem do "packageManager" do package.json
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Instalar dependências
      shell: bash
      run: pnpm install --frozen-lockfile
